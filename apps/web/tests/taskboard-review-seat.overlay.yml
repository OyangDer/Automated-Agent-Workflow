# V6-12 acceptance: the two shipped Taskboard plugin layers, with the liveness
# window widened so the second Host observes the dead holder inside the test:
# boot 1 seats a reviewer through the real path, the Host is disposed, and boot 2
# comes up on the SAME harness home and session root — the reviewer's stored
# record survives, its process does not. That is the production shape the probe
# found, and the one the old liveness pass could not judge.

- insert:
    - id: taskboard
      name: '@deepseek-ai/dsh-taskboard'
      config:
        reviewerStaleTimeoutMs: 30000
        reconcileIntervalMs: 3000

- insert:
    - id: ui-taskboard
      name: '@deepseek-ai/dsh-client-ui-taskboard'
