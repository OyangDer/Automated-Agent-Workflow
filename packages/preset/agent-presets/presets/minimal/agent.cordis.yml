# The `minimal` agent preset: a fixed-prompt, single-tool coding-agent composition.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model receives only
# the persistent shell (`bash` on POSIX, `pwsh` on win32). Context compaction IS
# mounted (compaction-basic plus the tool-result pruner at the tail of this
# file): without it a long dispatched run re-uploads its whole growing context
# on every request, which dominates the token cost of taskboard workers.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
# Exactly one shell stack mounts per host: the bash stack gates off win32 and
# its pwsh twin gates off POSIX, mirroring the one-shot shell rows.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

# ── compaction ──────────────────────────────────────────────────────────────
# A dispatched session pays for its whole accumulated context on every single
# request, so cost tracks steps x context size. Compaction is the only mechanism
# that shrinks that context, and it is ceiling-triggered, not periodic:
#   thresholdTokens = contextWindow * thresholdRatio   (compaction-basic's default
#   ratio is 0.8, i.e. a 1M-token window only folds at 800K)
# Real sessions end long before such a ceiling: measured taskboard runs plateau
# at 100K-600K, so a default-ratio compaction never fires and the context grows
# to the end of the run. These explicit budgets put the ceiling inside the range
# sessions actually occupy (1M x 0.10 = 100K, retaining 1M x 0.03 = 30K), which a
# replay of 33 recorded sessions prices at 45-89% fewer tokens on the long ones.
# The tool-result pruner additionally caps any single oversized tool result so
# one huge file read cannot sit in context for the rest of the run.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        # Ceiling 100K / retained tail 30K on the shipped 1M-token window.
        thresholdRatio: 0.1
        retainRatio: 0.03

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
